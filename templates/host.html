{% extends "base.html" %}
{% load static %}
{% block content %}

<div class="host-header">
    <h1 class="text-3xl font-bold">{{ code }}</h1>
    <div class="host-actions">
        <button id="start-btn" class="btn btn-sm btn-success">Начать</button>
        <button id="next-btn" class="btn btn-sm btn-primary hidden">Следующий</button>
        <button id="finish-btn" class="btn btn-sm btn-danger">Завершить</button>
    </div>
</div>

<div class="host-entry-card card">
    <img class="host-entry-qr" src="{{ qr_url }}" alt="QR-код комнаты {{ code }}">
    <div class="host-entry-meta">
        <div class="host-entry-code">{{ code }}</div>
        <a class="host-entry-link" href="{{ lobby_url }}" target="_blank" rel="noopener noreferrer">{{ lobby_url }}</a>
    </div>
</div>

<div id="players" class="players-grid-host"></div>
<div id="host-game-panel" class="host-game-panel hidden">
    <div id="question" class="card hidden"></div>
    <aside id="host-live-leaderboard" class="card host-live-leaderboard hidden" aria-live="polite"></aside>
</div>
<div id="leaderboard" class="card hidden"></div>

<div class="chat-console-shell">
    <div class="card chat-console" aria-label="Chat">
        <span class="chat-corner chat-corner-tl"></span>
        <span class="chat-corner chat-corner-tr"></span>
        <span class="chat-corner chat-corner-bl"></span>
        <span class="chat-corner chat-corner-br"></span>
        <span class="chat-scanline"></span>
        <span class="chat-bar chat-bar-top-1"></span>
        <span class="chat-bar chat-bar-top-2"></span>
        <span class="chat-bar chat-bar-top-3"></span>
        <span class="chat-bar chat-bar-bottom-1"></span>
        <span class="chat-bar chat-bar-bottom-2"></span>
        <span class="chat-bar chat-bar-bottom-3"></span>

        <div class="chat-console-label">
            <span class="chat-label-arrow">&gt;</span>
            <span>ROOM_CHAT</span>
            <span class="chat-console-cursor" aria-hidden="true"></span>
        </div>

        <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>

        <div class="chat-input-row chat-console-input">
            <span class="chat-prompt" aria-hidden="true">$</span>
            <input id="chat-input" type="text" maxlength="200" placeholder="ENTER MESSAGE" class="input" autocomplete="off">
            <button id="chat-send" type="button" class="btn btn-primary" aria-label="Send message">&gt;&gt;</button>
        </div>
    </div>
</div>

{% include "includes/reactions.html" %}

{% endblock %}

{% block extra_js %}
<script>window.LOBBY_CODE = "{{ code }}";</script>
<script src="{% static 'js/host.js' %}"></script>
<script src="{% static 'js/reactions.js' %}"></script>
{% endblock %}
